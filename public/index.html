<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cursor.ai · Notes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="brand">
          <span class="brand__dot"></span>
          <h1 class="brand__title">cursor.ai Notes</h1>
        </div>
        <p class="app__subtitle">A tiny full-stack demo proving the dev environment works end to end.</p>
        <span id="status" class="status status--pending">checking API…</span>
      </header>

      <form id="note-form" class="composer" autocomplete="off">
        <input
          id="note-input"
          class="composer__input"
          type="text"
          placeholder="Write a note and press Enter…"
          aria-label="Note text"
          required
        />
        <button class="composer__button" type="submit">Add</button>
      </form>

      <ul id="notes" class="notes" aria-live="polite"></ul>
      <p id="empty" class="notes__empty">No notes yet. Add your first one above.</p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
